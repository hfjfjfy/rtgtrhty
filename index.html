<body>
  <div class="shell">
    <header class="top"><button class="profile" data-action="profile"><span class="avatar" id="avatar">A</span><span class="profile-copy"><b id="user-name">Александр</b><small id="user-handle">личный кабинет</small></span></button><button class="balance" data-action="wallet"><small>Баланс</small><strong>12 450 ₽</strong></button></header>
    <main id="main" class="main"></main>
    <nav class="nav"><button data-page="home" class="active"><span class="icon">⌂</span>Главная</button><button data-page="history"><span class="icon">↔</span>История</button><button data-page="exchange"><span class="icon">⇄</span>Обмен</button></nav>
  </div>
  <div id="overlay"></div><div id="toast-root" aria-live="polite"></div>
  <script type="module">
    // 1) After Render creates the API, replace the URL below with its HTTPS service URL.
    const API_BASE_URL = 'https://YOUR-RENDER-SERVICE.onrender.com'.replace(/\/$/, '');
    const CONFIG = { exchangeRate: 88, currencyFrom: 'USDT', currencyTo: 'RUB', minExchange: 10, channelUrl: 'https://t.me/north_exchange' };
    const mockUser = { firstName: 'Александр', username: 'north_user', id: '—', photoUrl: '' };
    const banks = ['СберБанк','Т-Банк','Альфа-Банк','ВТБ','Газпромбанк','Райффайзенбанк','Другой банк'];
    const reviews = [
      {name:'Мария К.',date:'Сегодня, 12:41',text:'Заявку обработали быстро, курс совпал с тем, что был на экране. Спасибо!',avatar:'М'},
      {name:'Илья',date:'Вчера, 19:08',text:'Понятный интерфейс, перевод пришёл без лишних вопросов.',avatar:'И'},
      {name:'Наталья Р.',date:'22 сентября',text:'Удобно, что сразу видна итоговая сумма. Буду пользоваться ещё.',avatar:'Н'},
    ];
    const methods = [{name:'USDT',detail:'TRC20',icon:'₮'},{name:'USDT',detail:'TON',icon:'₮'},{name:'CryptoBot',detail:'@send',icon:'✦'},{name:'xRocket',detail:'@xrocket',icon:'✧'}];
    const LOCAL_ORDERS_KEY = 'north.exchange.orders.v2';
    let API_READY = false;
    const $ = (s,root=document)=>root.querySelector(s);
    const main = $('#main'), overlay = $('#overlay');
    const state = {page:'home',sheet:null,walletTab:'deposit',walletConnected:false,selectedMethod:'',amount:'',fullName:'',bank:'',card:'',orders:[],selectedOrder:null,toastTimer:null,lastFocus:null};
    const tg = window.Telegram?.WebApp;
    const rub = v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v)||0);
    const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cardDigits = ()=>state.card.replace(/\D/g,'').slice(0,16);
    const cardFormat = s=>(s.match(/.{1,4}/g)||[]).join(' ');
    const amountValid = ()=>Number(state.amount)>=CONFIG.minExchange&&Number.isFinite(Number(state.amount));
    const formValid = ()=>amountValid()&&state.fullName.trim().length>=3&&!!state.bank&&cardDigits().length===16;
    const haptic = success=>{try{if(success)tg?.HapticFeedback?.notificationOccurred('success');else tg?.HapticFeedback?.selectionChanged()}catch{}};
    async function apiRequest(path,options={}){
      const r=await fetch(`${API_BASE_URL}${path}`,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
      const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`API ${r.status}`);return data;
    }
    const localOrders=()=>{try{return JSON.parse(localStorage.getItem(LOCAL_ORDERS_KEY)||'[]')}catch{return[]}};
    const orderRepository={
      async list(){if(API_READY){try{return(await apiRequest('/api/orders')).orders||[]}catch{API_READY=false}}return localOrders()},
      async create(order){if(API_READY){const r=await apiRequest('/api/orders',{method:'POST',body:JSON.stringify({amount:order.amount,fullName:order.fullName,bank:order.bank,cardLast4:order.cardLast4})});return{order:r.order,orders:r.orders}}const list=localOrders();list.unshift(order);try{localStorage.setItem(LOCAL_ORDERS_KEY,JSON.stringify(list))}catch{}return{order,orders:list}}
    };
    function toast(message,type='info'){clearTimeout(state.toastTimer);$('#toast-root').innerHTML=`<div class="toast ${type}">${esc(message)}</div>`;state.toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3200)}
    function setupTelegram(){try{tg?.ready();tg?.expand()}catch{}const u=tg?.initDataUnsafe?.user;if(u){$('#user-name').textContent=u.first_name||'Пользователь';$('#user-handle').textContent=u.username?'@'+u.username:'Telegram';if(u.photo_url)$('#avatar').innerHTML=`<img src="${esc(u.photo_url)}" alt="">`}try{tg?.BackButton?.onClick(back);tg?.BackButton?.hide()}catch{}}
    function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='home')home();else if(state.page==='exchange')exchange();else history();try{if(state.sheet||state.page!=='home')tg?.BackButton?.show();else tg?.BackButton?.hide()}catch{}}
    function home(){main.innerHTML=`<div class="pills"><button class="pill" data-action="reviews"><span class="gold">★</span> Отзывы <span class="gold">4.9</span></button><button class="pill" data-action="channel">↗ Канал <i class="online"></i></button></div><section class="hero"><div class="eyebrow"><i></i>ОБМЕННИК · РАБОТАЕМ 24/7</div><div class="pair"><span class="coins"><b>₮</b><b>₽</b></span><span class="muted">↘</span><span class="pair-label">USDT <span class="muted">→</span> RUB</span></div><div class="rate-caption">Текущий курс</div><div class="rate">${CONFIG.exchangeRate}<small> ₽</small></div><div class="rate-foot"><span>1 USDT = ${CONFIG.exchangeRate} ₽</span><span class="green">● Курс зафиксирован</span></div></section><div class="trust"><span class="trust-icon">⌁</span><span><b>Прозрачный обмен</b><small>Без скрытых комиссий</small></span><span>✓</span></div><button class="cta" data-action="go-exchange">Обменять USDT <span class="arrow">↗</span></button><p class="note">◇ Быстрый обмен USDT → RUB</p><section><div class="section-title"><h2>Как это работает</h2><small>3 шага</small></div><div class="steps"><div><i>01</i><b>Укажите сумму</b><small>Курс виден сразу</small></div><div><i>02</i><b>Введите реквизиты</b><small>Карта любого банка</small></div><div><i>03</i><b>Получите рубли</b><small>Следите за заявкой</small></div></div></section>`}
    function exchange(){main.innerHTML=`<div class="page-head"><button class="back" data-action="back-home">← Назад</button><div class="eyebrow">НОВАЯ ОПЕРАЦИЯ</div><h1>Обмен USDT <span class="green">→</span> RUB</h1><p>Курс <b>1 USDT = ${CONFIG.exchangeRate} ₽</b></p></div><section class="form-card"><label class="label" for="amount">Сколько USDT отправляете?</label><div class="amount-row"><input id="amount" type="number" inputmode="decimal" min="${CONFIG.minExchange}" step="0.01" placeholder="0.00" value="${esc(state.amount)}"><span class="currency">₮ USDT</span></div><div id="amount-hint" class="hint">Минимум ${CONFIG.minExchange} USDT · без комиссии</div><div class="receive"><div><span>Вы получите</span><strong><b id="rub-value">${rub(Number(state.amount)*CONFIG.exchangeRate)}</b> ₽</strong></div><span>↓</span></div></section><section class="fields"><div class="section-title"><div><h2>Данные получателя</h2><small>Рубли поступят на эту карту</small></div><small class="green">⌑ Защищено</small></div><div class="field"><label>ФИО получателя</label><input data-field="fullName" autocomplete="name" placeholder="Например, Иван Иванов" value="${esc(state.fullName)}"><i>${state.fullName.trim().length>=3?'✓':''}</i></div><div class="field"><label>Банк получателя</label><select data-field="bank"><option value="">Выберите банк</option>${banks.map(b=>`<option value="${esc(b)}" ${b===state.bank?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div class="field"><label>Номер карты</label><input data-field="card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" value="${esc(cardFormat(cardDigits()))}"><i>${cardDigits().length===16?'✓':''}</i></div><p class="secure">◈ Для демо-заявки сервер получит только последние 4 цифры карты. Не вводите реальные платёжные данные.</p></section><div class="form-footer"><button class="cta" data-action="continue" ${formValid()?'':'disabled'}>Продолжить <span class="arrow">→</span></button><div class="center-note">⌑ Mock API · реальные переводы отключены</div></div>`}
    function history(){const rows=state.orders.length?state.orders.map(o=>`<button class="order" data-order="${esc(o.id)}"><span class="order-coin">₮</span><span class="order-main"><b>USDT → RUB</b><small>${new Date(o.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></span><span class="order-sums"><b>−${rub(o.amount)} USDT</b><strong>+${rub(o.rub)} ₽</strong></span><span class="status"><i></i>${esc(o.status)}</span></button>`).join(''):`<div class="empty"><span class="symbol">↔</span><h3>Здесь будут ваши обмены</h3><p>Создайте заявку — она появится здесь.</p><button class="text-btn" data-action="go-exchange">Создать обмен →</button></div>`;main.innerHTML=`<div class="history-head"><div><div class="eyebrow">ВАШИ ОПЕРАЦИИ</div><h1>История</h1><small class="muted">${state.orders.length?`${state.orders.length} заявок`:'Все заявки в одном месте'}</small></div><span class="counter">${String(state.orders.length).padStart(2,'0')}</span></div>${rows}`}
    function openSheet(type){state.sheet=type;state.lastFocus=document.activeElement;drawSheet();renderNavBack();haptic()}
    function renderNavBack(){try{if(state.sheet||state.page!=='home')tg?.BackButton?.show();else tg?.BackButton?.hide()}catch{}}
    function closeSheet(){if(!state.sheet)return;state.sheet=null;overlay.innerHTML='';renderNavBack();state.lastFocus?.focus?.()}
    function drawSheet(){let title='',content='';if(state.sheet==='wallet'){title='Кошелёк';content=`<div class="wallet-row"><span class="wallet-icon">◈</span><div><b>${state.walletConnected?'Кошелёк подключён':'Кошелёк не подключён'}</b><small>${state.walletConnected?'TRC20 · TQ••••••••••••8A2f':'Демо-режим подключения'}</small></div><button data-action="connect">${state.walletConnected?'Отключить':'Подключить +'}</button></div><div class="tabs"><button data-tab="deposit" class="${state.walletTab==='deposit'?'active':''}">Пополнить</button><button data-tab="withdraw" class="${state.walletTab==='withdraw'?'active':''}">Вывод</button></div><div class="section-title"><h2>USDT</h2><small>Выберите способ</small></div><div class="method-grid">${methods.map((m,i)=>`<button class="method ${state.selectedMethod===i?'selected':''}" data-method="${i}">${m.icon} ${m.name}<span>${m.detail}</span></button>`).join('')}</div><div class="wallet-info">${state.walletTab==='deposit'?'Минимальное пополнение от $1.':'Демо-вывод недоступен без сервера кошелька.'} Не отправляйте реальные средства: платежи не подключены.</div>${state.selectedMethod!==''?`<div class="info">Выбран способ: ${esc(methods[state.selectedMethod].name)} ${esc(methods[state.selectedMethod].detail)}. Реальная отправка не настроена.</div>`:''}`}
      if(state.sheet==='reviews'){title='Отзывы';content=`<div class="review-score"><b>4.9</b><span>★★★★★<small class="muted"> · оценки пользователей</small></span></div>${reviews.map(r=>`<article class="review"><b>${r.avatar} ${esc(r.name)}</b><small class="muted"> · ${esc(r.date)}</small><p>★★★★★ · ${esc(r.text)}</p></article>`).join('')}`}
      if(state.sheet==='channel'){title='Наш канал';content=`<div class="channel-box"><span class="channel-logo">N</span><h3>North Exchange</h3><p>Курсы, обновления и поддержка сервиса.</p><p class="green">● 2 840 подписчиков</p></div><button class="cta" data-action="open-channel">Перейти в канал <span class="arrow">↗</span></button>`}
      if(state.sheet==='confirm'){title='Проверьте данные';content=`<div class="confirm-amount"><span>Вы отправляете</span><b>${rub(state.amount)} USDT</b><span>Получатель получит</span><strong>${rub(Number(state.amount)*CONFIG.exchangeRate)} ₽</strong></div>${[['Курс',`1 USDT = ${CONFIG.exchangeRate} ₽`],['Получатель',state.fullName],['Банк',state.bank],['Карта',`•••• •••• •••• ${cardDigits().slice(-4)}`]].map(([a,b])=>`<div class="confirm-row"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}<p class="modal-note">Это демо-заявка: платёж не отправляется. На сервер уйдёт только сумма, имя, банк и последние 4 цифры карты.</p><button class="cta" data-action="confirm">Создать mock-заявку <span class="arrow">✓</span></button><button class="text-btn" data-action="close">Изменить данные</button>`}
      if(state.sheet==='success'){title='';const o=state.selectedOrder;content=`<div class="success-mark">✓</div><div class="success-text"><span class="green">Заявка создана</span><h2>${esc(o.id)}</h2><p>Обмен ${rub(o.amount)} USDT → ${rub(o.rub)} ₽</p><p>Статус: ${esc(o.status)}</p></div><button class="cta" data-action="success-history">Перейти в историю <span class="arrow">→</span></button><button class="text-btn" data-action="success-home">На главную</button>`}
      if(state.sheet==='order'){title='Детали заявки';const o=state.selectedOrder;content=o?`<div class="confirm-amount"><span>${esc(o.id)} · ${esc(o.status)}</span><strong>${rub(o.rub)} ₽</strong><b>−${rub(o.amount)} USDT</b></div>${[['Дата',new Date(o.createdAt).toLocaleString('ru-RU')],['Курс',`1 USDT = ${o.rate} ₽`],['Получатель',o.fullName],['Банк',o.bank],['Карта',`•••• •••• •••• ${o.cardLast4}`]].map(([a,b])=>`<div class="detail"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}`:''}
      overlay.innerHTML=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><header class="sheet-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Закрыть">×</button></header>${content}</section></div>`}
    function back(){if(state.sheet)closeSheet();else if(state.page!=='home'){state.page='home';render()}}
    async function submitOrder(){const order={id:`EX-${String(Date.now()).slice(-6)}`,createdAt:new Date().toISOString(),amount:Number(state.amount),rate:CONFIG.exchangeRate,rub:Number(state.amount)*CONFIG.exchangeRate,fullName:state.fullName.trim(),bank:state.bank,cardLast4:cardDigits().slice(-4),status:'Обрабатывается'};try{const result=await orderRepository.create(order);state.orders=result.orders;state.selectedOrder=result.order;state.sheet='success';drawSheet();haptic(true)}catch(e){toast(e.message||'Сервер недоступен. Заявка не создана.','error')}}
    document.addEventListener('click',e=>{
      if(e.target.classList.contains('backdrop')){closeSheet();return}
      const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;closeSheet();render();window.scrollTo({top:0,behavior:'smooth'});return}
      const tab=e.target.closest('[data-tab]');if(tab){state.walletTab=tab.dataset.tab;state.selectedMethod='';drawSheet();return}
      const method=e.target.closest('[data-method]');if(method){state.selectedMethod=Number(method.dataset.method);drawSheet();return}
      const order=e.target.closest('[data-order]');if(order){state.selectedOrder=state.orders.find(o=>o.id===order.dataset.order);openSheet('order');return}
      const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;
      if(action==='wallet'||action==='reviews'||action==='channel')openSheet(action);
      else if(action==='go-exchange'){state.page='exchange';render()}
      else if(action==='back-home'){state.page='home';render()}
      else if(action==='close')closeSheet();
      else if(action==='continue'){if(formValid())openSheet('confirm');else toast('Заполните все поля и проверьте сумму','error')}
      else if(action==='confirm')submitOrder();
      else if(action==='connect'){state.walletConnected=!state.walletConnected;drawSheet();toast('Изменено демо-состояние кошелька')}
      else if(action==='open-channel'){if(tg?.openTelegramLink)tg.openTelegramLink(CONFIG.channelUrl);else window.open(CONFIG.channelUrl,'_blank','noopener')}
      else if(action==='success-history'){closeSheet();state.page='history';render()}
      else if(action==='success-home'){closeSheet();state.page='home';render()}
      else if(action==='profile')toast(`Telegram ID: ${tg?.initDataUnsafe?.user?.id||'демо-профиль'}`)
    });
    document.addEventListener('input',e=>{
      if(e.target.id==='amount'){state.amount=e.target.value;$('#rub-value').textContent=rub(Number(state.amount)*CONFIG.exchangeRate);const bad=!!state.amount&&!amountValid();$('#amount-hint').textContent=bad?`Минимальная сумма — ${CONFIG.minExchange} USDT`:`Минимум ${CONFIG.minExchange} USDT · без комиссии`;$('#amount-hint').classList.toggle('error',bad)}
      const f=e.target.dataset.field;if(!f)return;if(f==='card'){state.card=e.target.value.replace(/\D/g,'').slice(0,16);e.target.value=cardFormat(state.card)}else state[f]=e.target.value;
      const check=e.target.parentElement.querySelector('i');if(check)check.textContent=f==='fullName'?(state.fullName.trim().length>=3?'✓':''):(cardDigits().length===16?'✓':'');const btn=$('[data-action="continue"]');if(btn)btn.disabled=!formValid();
    });
    document.addEventListener('change',e=>{if(e.target.dataset.field==='bank'){state.bank=e.target.value;const btn=$('[data-action="continue"]');if(btn)btn.disabled=!formValid()}});
    document.addEventListener('focusin',e=>{if(e.target.matches('input,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),180)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
    let touchY=0;overlay.addEventListener('touchstart',e=>{if(e.target.closest('.handle,.sheet-head'))touchY=e.touches[0].clientY},{passive:true});overlay.addEventListener('touchend',e=>{if(touchY&&e.changedTouches[0].clientY-touchY>90)closeSheet();touchY=0},{passive:true});
    setupTelegram();state.orders=await orderRepository.list();render();
    async function connectBackend(){if(API_BASE_URL.includes('YOUR-RENDER-SERVICE'))return;try{const result=await apiRequest('/api/config');Object.assign(CONFIG,result.config||{});API_READY=true;state.orders=await orderRepository.list();render()}catch{API_READY=false;toast('Render API недоступен — открыт демо-режим')}}
    connectBackend();
  </script>
</body>
</html>
